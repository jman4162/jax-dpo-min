[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-dpo-min"
version = "0.0.1"
description = "Minimal from-scratch DPO (Direct Preference Optimization) in JAX"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "flax>=0.8",
    "optax>=0.2",
    "orbax-checkpoint>=0.5",
    "transformers>=4.44,<5",
    "datasets>=2.20",
    "numpy",
    "pyyaml",
    "sentencepiece",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
colab-gpu = ["jax[cuda12]>=0.4.30"]

[tool.setuptools]
py-modules = ["losses", "data", "model", "lora", "train", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", ".venv", "outputs", "checkpoints", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ["build/", "outputs/", "checkpoints/"]
